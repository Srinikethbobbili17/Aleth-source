name: Backend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep in step with the rust image in backend/Dockerfile.
  RUST_TOOLCHAIN: "1.99.1"

defaults:
  run:
    working-directory: backend

jobs:
  check:
    name: Format, lint, and test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: rss
          POSTGRES_PASSWORD: rss_ci_password
          POSTGRES_DB: rss
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rss -d rss"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The service's superuser can create the isolated databases sqlx::test needs.
      DATABASE_URL: postgres://rss:rss_ci_password@localhost:5432/rss
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit and HTTP tests
        run: cargo test --locked
      - name: PostgreSQL tests
        run: cargo test --locked -- --ignored

  docker:
    name: Docker image and Compose smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up --detach --build --wait --wait-timeout 300
      - name: Check readiness
        run: curl --fail --silent --show-error http://127.0.0.1:3000/health/ready
      - name: Show logs
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down --volumes
